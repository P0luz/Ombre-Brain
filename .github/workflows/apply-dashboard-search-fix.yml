name: Apply verified dashboard search fix

on:
  push:
    branches:
      - fix/preserve-dashboard-search-after-refresh

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preserve-dashboard-search-after-refresh
          fetch-depth: 0

      - name: Apply dashboard fix and regression test
        shell: python
        run: |
          from pathlib import Path

          dashboard = Path("frontend/dashboard.html")
          raw = dashboard.read_bytes()
          old = (
              b"    updateStats();\r\n"
              b"    buildFilters();\r\n"
              b"    // \xe6\x95\xb0\xe6\x8d\xae\xe5\x88\xb7\xe6\x96\xb0\xe4\xb8\x8d\xe7\xad\x89\xe4\xba\x8e\xe7\x94\xa8\xe6\x88\xb7\xe5\x88\x87\xe6\x8d\xa2\xe8\xa7\x86\xe5\x9b\xbe\xef\xbc\x9a\xe7\xbb\xa7\xe7\xbb\xad\xe5\xba\x94\xe7\x94\xa8\xe5\xbd\x93\xe5\x89\x8d\xe7\xad\x9b\xe9\x80\x89\xef\xbc\x8c\xe5\xb9\xb6\xe4\xbf\x9d\xe7\x95\x99\xe6\x89\x80\xe5\x9c\xa8\xe9\xa1\xb5\xe3\x80\x82\r\n"
              b"    // \xe8\x8b\xa5\xe5\x88\xb7\xe6\x96\xb0\xe5\x90\x8e\xe9\xa1\xb5\xe6\x95\xb0\xe5\x87\x8f\xe5\xb0\x91\xef\xbc\x8c_paintBuckets \xe4\xbc\x9a\xe8\x87\xaa\xe5\x8a\xa8\xe6\x8a\x8a bucketPage \xe6\x94\xb6\xe6\x95\x9b\xe5\x88\xb0\xe6\x9c\xab\xe9\xa1\xb5\xe3\x80\x82\r\n"
              b"    renderBuckets(filterBuckets(allBuckets), true);\r\n"
          )
          new = (
              b"    updateStats();\r\n"
              b"    buildFilters();\r\n"
              b"    // \xe6\x95\xb0\xe6\x8d\xae\xe5\x88\xb7\xe6\x96\xb0\xe4\xb8\x8d\xe7\xad\x89\xe4\xba\x8e\xe7\x94\xa8\xe6\x88\xb7\xe5\x88\x87\xe6\x8d\xa2\xe8\xa7\x86\xe5\x9b\xbe\xef\xbc\x9a\xe8\x8b\xa5\xe6\x90\x9c\xe7\xb4\xa2\xe6\xa1\x86\xe9\x87\x8c\xe4\xbb\x8d\xe6\x9c\x89\xe6\x9f\xa5\xe8\xaf\xa2\xef\xbc\x8c\xe9\x87\x8d\xe8\xb7\x91\xe6\x90\x9c\xe7\xb4\xa2\xe4\xbb\xa5\xe4\xbf\x9d\xe6\x8c\x81\xe7\xbb\x93\xe6\x9e\x9c\xe8\xa7\x86\xe5\x9b\xbe\xef\xbc\x9b\r\n"
              b"    // \xe5\x90\xa6\xe5\x88\x99\xe7\xbb\xa7\xe7\xbb\xad\xe5\xba\x94\xe7\x94\xa8\xe5\xbd\x93\xe5\x89\x8d\xe7\xad\x9b\xe9\x80\x89\xef\xbc\x8c\xe5\xb9\xb6\xe4\xbf\x9d\xe7\x95\x99\xe6\x89\x80\xe5\x9c\xa8\xe9\xa1\xb5\xe3\x80\x82\r\n"
              b"    // \xe8\x8b\xa5\xe5\x88\xb7\xe6\x96\xb0\xe5\x90\x8e\xe9\xa1\xb5\xe6\x95\xb0\xe5\x87\x8f\xe5\xb0\x91\xef\xbc\x8c_paintBuckets \xe4\xbc\x9a\xe8\x87\xaa\xe5\x8a\xa8\xe6\x8a\x8a bucketPage \xe6\x94\xb6\xe6\x95\x9b\xe5\x88\xb0\xe6\x9c\xab\xe9\xa1\xb5\xe3\x80\x82\r\n"
              b"    var activeQuery = (document.getElementById('search-input') || {}).value || '';\r\n"
              b"    if (activeQuery.trim()) {\r\n"
              b"      await searchBuckets(activeQuery.trim());\r\n"
              b"    } else {\r\n"
              b"      renderBuckets(filterBuckets(allBuckets), true);\r\n"
              b"    }\r\n"
          )
          if raw.count(old) != 1:
              raise SystemExit(f"dashboard target count was {raw.count(old)}, expected 1")
          dashboard.write_bytes(raw.replace(old, new, 1))

          tests = Path("tests/test_dashboard_bucket_view_state.py")
          text = tests.read_text(encoding="utf-8")
          marker = '''def test_filter_rebuild_restores_active_filter_without_listener_leaks():\n'''
          regression = '''def test_bucket_reload_preserves_active_search_results():\n    source = _dashboard_section(\n        "async function loadBuckets()", "function updateStats()"\n    )\n\n    assert "document.getElementById('search-input')" in source\n    assert "if (activeQuery.trim())" in source\n    assert "await searchBuckets(activeQuery.trim());" in source\n    assert "else {" in source\n    assert "renderBuckets(filterBuckets(allBuckets), true);" in source\n\n\n'''
          if regression not in text:
              if text.count(marker) != 1:
                  raise SystemExit("test insertion marker missing or ambiguous")
              tests.write_text(text.replace(marker, regression + marker, 1), encoding="utf-8")

      - name: Run focused tests
        run: |
          python -m pip install pytest
          PYTHONPATH=. python -m pytest tests/test_dashboard_bucket_view_state.py tests/test_dashboard_auth_flow.py -q

      - name: Commit verified fix and remove one-shot workflow
        run: |
          git config user.name "MorphieEndless"
          git config user.email "216736159+MorphieEndless@users.noreply.github.com"
          git rm .github/workflows/apply-dashboard-search-fix.yml
          git add frontend/dashboard.html tests/test_dashboard_bucket_view_state.py
          git commit -s -m "fix(dashboard): preserve search results after bucket refresh"
          git push origin HEAD:fix/preserve-dashboard-search-after-refresh
